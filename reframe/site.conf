# site.conf - settings for run_prerelease.sh (bash syntax).
# Every KEY here is exported as SOL_<KEY> for ReFrame, inventory.py and report.py.

# --- where and how jobs are submitted
RESERVATION="oct2026_maint"
EXCLUDE_NODES="sg[001-050],sdg051,sg[235-239],scg[009-012]"   # validated by the HPL runs
SUBMIT_PARTITIONS="general public htc highmem lightwork fpga gaudi arm"   # first one that has the node and fits wins
QOS=""                       # --qos for every job (empty = none)
QOS_MAP="general=private"    # per-partition QOS: ASU moves general/public jobs to public; non-owners use private on general
ACCOUNT=""                   # --account for every job (empty = none)
MAX_PENDING="30m"            # node stage: cancel a job still pending after this long
MPI_MAX_PENDING="4h"         # MPI stage: longer, a group's jobs wait for each other on the same nodes

# --- tools
REFRAME="reframe"            # ReFrame 4.10.4 (needs Python 3.10+)
PYTHON="python3"             # python for inventory.py and report.py

# --- modules (newest version of each; never more than one)
MOD_GCC="gcc/16.1.0"
MOD_CUDA="cuda-13.2.1-gcc-13.2.0"
MOD_NODE_MPI="openmpi/5.0.8-gcc-15.2.0"
MOD_GCC_AARCH64=""           # empty = system gcc on the GH200 nodes
MOD_CUDA_AARCH64=""          # empty = GPU performance step skipped on aarch64
MOD_NODE_MPI_AARCH64=""      # empty = MPI hello skipped on aarch64 (srun launch still checked)
MPI_CANDIDATES="openmpi=openmpi/5.0.8-gcc-15.2.0 mpich=mpich/4.3.2-srun-gcc-15.2.0 hpcx=hpcx/2.25.1"
SRUN_MPI="pmix"              # srun --mpi=<this>
# optional override for one MPI, SRUN_MPI_<key> (unset or empty = SRUN_MPI). <key> is an MPI_CANDIDATES key
# (openmpi, mpich, hpcx: the OSU tests), node_mpi (MOD_NODE_MPI: MPI hello and pairwise) or hpcx (GPU-direct too)
#SRUN_MPI_mpich="pmi2"

# --- multi-node groups: name|slurm partition|hostlist|nodes for collectives|gpu (yes/no)
MPI_GROUPS="
cpu-zen3|public|sc[006-112]|64|no
cpu-zen4|general|scc[009-057]|32|no
gpu-a30|general|scg[007-008,013-014],sg[230-234]|9|yes
gpu-l40s|general|scg[015,017-019,022-023,025,027,029]|9|yes
"
GPU_DIRECT="no"              # yes = also run hpcx osu_bw/osu_latency with GPU buffers on the gpu groups

# --- benchmark sizes and limits
OSU_URL="https://mvapich.cse.ohio-state.edu/download/mvapich/osu-micro-benchmarks-7.5.2.tar.gz"
OSU_TARBALL=""               # pre-downloaded tarball, for a login node without internet
STREAM_ELEMS="268435456"     # doubles per array: 2 GiB each, 6 GiB total
GPU_SECONDS="20"             # seconds per GEMM precision on each GPU
NODE_TIME_LIMIT="20m"
MPI_TIME_LIMIT="15m"         # per MPI-stage job; a hung job holds up its group's queue this long

# --- report thresholds
OUTLIER_FRACTION="0.90"      # flag a node or GPU below 90% of its group median
HISTORY_DROP="0.10"          # flag a node or GPU more than 10% slower than the baseline run
